plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ontario.app'
    compileSdk 19 // Використовуємо сучасний SDK для компіляції
    ndkVersion "21.4.7075529"

    defaultConfig {
        applicationId "com.ontario.app"
        minSdk 19    // Android 4.4.4 KitKat
        targetSdk 19
        versionCode 1
        versionName "1.0"
        externalNativeBuild {
            cmake {
                cFlags "-O3 -Wall" // Максимальна оптимізація швидкості
            }
        }
        
        // 2. Жорстко фіксуємо архітектуру x86 для Intel Atom
        ndk {
            abiFilters 'x86'
        }
    }
    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.10.2" // Або інша версія, що є в твоєму SDK
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // Жодних зовнішніх бібліотек для мінімалізму
}
